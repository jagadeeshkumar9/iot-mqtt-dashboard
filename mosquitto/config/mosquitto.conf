# Mosquitto broker configuration (mounted at /mosquitto/config/mosquitto.conf)

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log

# Default listener
listener 1883
protocol mqtt

# Websocket listener for browser-based MQTT (optional)
listener 9001
protocol websockets

# Security
allow_anonymous false
password_file /mosquitto/config/passwordfile

# Increase message persistence
message_size_limit 10240
